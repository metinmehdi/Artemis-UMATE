<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UMATE Panel</title>
    <link rel="stylesheet" href="/assets/fonts/fonts.css" />
    <link rel="stylesheet" href="panel.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%237fdcff'/%3E%3C/svg%3E" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <section id="view">
        <canvas id="spectator"></canvas>
        <div class="badge" id="live">● LIVE: what the learner sees</div>
        <div class="overlay" id="hover"></div>
        <div class="waiting" id="waiting">Waiting for a phone…</div>
      </section>

      <aside>
        <div class="card">
          <h2>Devices</h2>
          <div id="roster" class="roster">No phone connected</div>
          <div class="row" id="ai-row">AI buddy: <b id="ai-mode">–</b></div>
        </div>

        <div class="card">
          <h2>Trainer controls</h2>
          <div class="btns">
            <button data-cmd="recenter">Recenter view</button>
            <button data-cmd="say" data-text="Say hello to the learner and ask how they feel, in one short sentence.">Buddy: say hello</button>
            <button data-cmd="say" data-text="The learner may be stressed. Calmly guide one slow breath together, then ask if they are ready to continue.">Buddy: calm down</button>
            <button data-cmd="reset">Restart trip</button>
            <button data-cmd="reload" class="ghost">Reload phone</button>
          </div>
        </div>

        <div class="card grow">
          <h2>Conversation</h2>
          <div id="transcript" class="list"></div>
        </div>

        <div class="card grow">
          <h2>Events</h2>
          <div id="events" class="list mono"></div>
        </div>

        <div class="card connect">
          <div>
            <h2>Connect a phone</h2>
            <div id="urls" class="mono small"></div>
          </div>
          <img id="qr" alt="QR code for the phone URL" />
        </div>
      </aside>
    </main>
    <script type="module" src="panel.js"></script>
  </body>
</html>
